name: Back up CRM data
on:
  schedule:
    - cron: "41 */3 * * *"   # every 3 hours
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: backup-crm
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot the CRM
        env:
          CRM_API_KEY: ${{ secrets.CRM_API_KEY }}
        run: python3 scripts/backup_crm.py
      - name: Commit the backup
        run: |
          git config user.name "crm-backup"
          git config user.email "actions@users.noreply.github.com"
          git add -A backups
          git commit -m "CRM backup $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
