name: Email workbook
# Each Claude update commits state/email.json and state/crm.json. This workflow emails the summary
# with the workbook attached (when email.json changed) and sends the data + workbook to the CRM's
# Sheriff Sale page (when crm.json changed). In the final week, state/alert_email.json (new free & clear /
# decree / High sell odds properties, from scripts/hot.py) is emailed on its own, without the workbook.
# It also keeps state/assessed.json (county assessed values from WPRDC, for each property's real-estate tax):
# daily before the Claude run, and whenever crm.json changes (new parcels). Each CRM push also adds a second-opinion
# county ARV (scripts/county.py, county data in the Actions cache). Run it by hand to do any of these again.
on:
  schedule:
    - cron: "17 13 * * *"
  push:
    branches: [main]
    paths: ["state/email.json", "state/crm.json", "state/alert_email.json"]
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send the email"
        type: boolean
        default: true
      update_crm:
        description: "Update the CRM Sheriff Sale page"
        type: boolean
        default: true
      send_alert:
        description: "Send the latest final-week alert again"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: What changed
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          IN_EMAIL: ${{ inputs.send_email }}
          IN_CRM: ${{ inputs.update_crm }}
          IN_ALERT: ${{ inputs.send_alert }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            echo "email=false" >> "$GITHUB_OUTPUT"; echo "crm=false" >> "$GITHUB_OUTPUT"; echo "alert=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "email=$IN_EMAIL" >> "$GITHUB_OUTPUT"; echo "crm=$IN_CRM" >> "$GITHUB_OUTPUT"; echo "alert=$IN_ALERT" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || echo "state/email.json state/crm.json state/alert_email.json")
          echo "$files"
          echo "email=$(echo "$files" | grep -qx 'state/email.json' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "crm=$(echo "$files" | grep -qx 'state/crm.json' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "alert=$(echo "$files" | grep -qx 'state/alert_email.json' && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Fetch county assessed values (property tax)
        if: github.event_name == 'schedule' || steps.changed.outputs.crm == 'true'
        continue-on-error: true
        run: |
          python3 scripts/fetch_assessed.py
          if ! git diff --quiet -- state/assessed.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/assessed.json
            git commit -m "Update county assessed values"
            git pull --rebase -q && git push -q || echo "push of assessed.json failed"
          fi
      - name: Send email
        if: steps.changed.outputs.email == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 scripts/send_email.py
      - name: Send final-week alert
        if: always() && steps.changed.outputs.alert == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 scripts/send_email.py state/alert_email.json
      - name: Week
        id: wk
        if: always() && steps.changed.outputs.crm == 'true'
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore county data
        if: always() && steps.changed.outputs.crm == 'true'
        uses: actions/cache@v4
        with:
          path: cache
          key: county-${{ steps.wk.outputs.week }}
          restore-keys: county-
      - name: County data (for the second-opinion ARV)
        if: always() && steps.changed.outputs.crm == 'true'
        continue-on-error: true
        run: |
          built=$(cat cache/county.built 2>/dev/null || echo 2000-01-01)
          age=$(( ( $(date -u +%s) - $(date -u -d "$built" +%s) ) / 86400 ))
          if [ ! -f cache/county.pkl.gz ] || [ "$age" -ge 7 ]; then
            python3 scripts/county.py build /tmp/county && date -u +%F > cache/county.built
          fi
      - name: Update CRM Sheriff Sale page
        if: always() && steps.changed.outputs.crm == 'true'
        env:
          CRM_API_KEY: ${{ secrets.CRM_API_KEY }}
        run: |
          python3 scripts/fill_assessed.py || true
          cp state/crm.json /tmp/crm_county.json
          python3 scripts/county.py sheriff /tmp/crm_county.json || cp state/crm.json /tmp/crm_county.json
          if [ -f /tmp/crm_county.json ]; then python3 scripts/push_to_crm.py /tmp/crm_county.json; else python3 scripts/push_to_crm.py; fi
